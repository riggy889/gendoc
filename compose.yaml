name: gendoc

services:
  app:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - .:/var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - default
      - pdf
    depends_on:
      - gotenberg

  web:
    image: nginx:1.30.6-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  node:
    image: node:24-bookworm-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    command: sh -c "npm install && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html

  # Headless Chromium behind an HTTP API, used for PDF rendering.
  # It only joins the internal "pdf" network (no internet access) and publishes no ports.
  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    command:
      - gotenberg
      - --chromium-deny-list=^(?!(data:|file:///tmp/)).*
      - --chromium-disable-javascript=true
      - --api-timeout=20s
    networks:
      - pdf

networks:
  pdf:
    internal: true
