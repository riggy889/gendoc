; Production PHP-FPM pool overrides (loaded after the image's www.conf and docker.conf).
[global]
error_log = /proc/self/fd/2

[www]
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
; Answered by FPM itself, for the container healthcheck.
ping.path = /ping
; Laravel's config is cached at startup, but keep the environment available to workers too.
clear_env = no
; Request lines are logged by nginx; FPM's own access log would just duplicate them.
access.log = /dev/null
